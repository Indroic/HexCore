[project]
name = "hexcore"
version = "2.0.6"
authors = [
  { name="David Latosefki (Indroic)", email="indroic@outlook.com" },
]
description = "Núcleo reutilizable para proyectos Python con arquitectura hexagonal y event handling. Provee abstracciones, utilidades y contratos para DDD, eventos y desacoplamiento de infraestructura."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "croniter>=2.0.0",
    "pydantic>=2.11.7",
    "typer>=0.17.3",
    "ruff>=0.12.11",
]

license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.optional-dependencies]
api = ["fastapi>=0.116.1"]
redis = ["redis>=6.4.0"]
mongo = ["beanie>=2.0.0"]
sql = ["sqlalchemy>=2.0.43", "alembic>=1.16.5", "asyncpg>=0.30.0", "aiosqlite>=0.21.0"]
rabbitmq = ["aio-pika>=9.4.0", "pika>=1.3.2"]
procrastinate = ["procrastinate>=3.0.0"]
celery = ["celery>=5.4.0"]
all = [
    "fastapi>=0.116.1",
    "redis>=6.4.0",
    "beanie>=2.0.0",
    "sqlalchemy>=2.0.43", 
    "alembic>=1.16.5", 
    "asyncpg>=0.30.0", 
    "aiosqlite>=0.21.0",
    "aio-pika>=9.4.0", 
    "pika>=1.3.2",
    "procrastinate>=3.0.0",
    "celery>=5.4.0"
]


[project.scripts]
hexcore = "hexcore.__main__:app"

[dependency-groups]
dev = [
    "commitizen>=4.9.1",
    "pyright>=1.1.405",
    "pytest>=8.4.2",
]

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["."]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = false
major_version_zero = false
push = true
