name: Diagnóstico PAT (temporal, borrar después de usar)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probar-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con PERSONAL_ACCESS_TOKEN
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          fetch-depth: 1

      - name: Identidad
        run: |
          git config user.name "pat-diagnostico"
          git config user.email "pat-diagnostico@users.noreply.github.com"

      - name: Push inofensivo a una rama descartable
        run: |
          BRANCH="pat-diagnostico-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git commit --allow-empty -m "test: diagnostico de PERSONAL_ACCESS_TOKEN"
          git push origin "HEAD:$BRANCH"
          echo "Push OK a la rama $BRANCH. Podés borrarla."
