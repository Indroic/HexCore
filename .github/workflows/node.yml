name: Node tests

# Espejo de pytest.yml para @hexcore-js/darwin-client. Matriz 20/22/24: las tres LTS vivas — el
# `engines` del package.json es una promesa que nadie más verifica.
#
# El filtro por path va en un job `changes` y **no** en un `paths:` del `on:`. La diferencia no
# es de estilo: un workflow que el `paths:` filtra no arranca, así que no publica ningún check,
# y un required check que nunca reporta deja el PR bloqueado en "Expected — Waiting for status"
# para siempre. Un job que se salta por un `if:` sí reporta, y reporta `skipped`, que la
# protección de rama cuenta como éxito. Por eso `node-ok` corre siempre (`if: always()`) y
# acepta `skipped`: es él, y no `test`, el nombre que hay que marcar como obligatorio.
on:
  push:
    branches:
      - master
      - "release/**"
      - "feat/**"
  pull_request:
    branches:
      - master
      - "release/**"
      - "feat/**"

permissions:
  contents: read

jobs:
  changes:
    name: "¿Cambió algo de darwin-client?"
    runs-on: ubuntu-latest
    outputs:
      relevante: ${{ steps.filtro.outputs.relevante }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # El diff necesita la base del push/PR, que con el checkout superficial por defecto
          # no está en el clon.
          fetch-depth: 0

      - name: Ver qué rutas tocó el cambio
        id: filtro
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          # `package.json` y `package-lock.json` de la raíz están en el patrón porque son los
          # del workspace npm: cambiarlos cambia con qué se instala y con qué se buildea el
          # cliente, aunque `packages/darwin-client/` no se toque.
          PATRON: '^(packages/darwin-client/|package\.json$|package-lock\.json$|\.github/workflows/node\.yml$)'
        run: |
          set -euo pipefail

          # Sin una base utilizable —rama nueva (SHA de ceros), force-push, o un historial que
          # no la contiene— no hay diff que calcular. Se corre todo: equivocarse hacia "corrí
          # de más" cuesta minutos de runner; hacia "no corrí" cuesta un bug publicado.
          if [ -z "${BASE:-}" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::notice::Sin una base comparable. Se corre la suite completa."
            echo "relevante=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ARCHIVOS="$(git diff --name-only "$BASE" HEAD)"
          echo "Archivos tocados:"
          echo "$ARCHIVOS"

          if echo "$ARCHIVOS" | grep -qE "$PATRON"; then
            echo "relevante=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Este cambio no toca el cliente TypeScript. La suite se saltea."
            echo "relevante=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: "Node ${{ matrix.node }}"
    needs: changes
    if: needs.changes.outputs.relevante == 'true'
    runs-on: ubuntu-latest
    # A nivel de job y no del workflow: `node-ok` no hace checkout, así que
    # `packages/darwin-client` no existe ahí — un default a nivel workflow rompía ese job
    # con "No such file or directory" al querer *iniciar* el shell en un directorio inexistente.
    defaults:
      run:
        working-directory: packages/darwin-client
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          # El lockfile vive en la raíz del workspace, no en packages/darwin-client.
          cache-dependency-path: package-lock.json

      # Desde la raíz del workspace: `npm ci` con working-directory apuntando al paquete
      # instalaría sólo ese subárbol y no resolvería el workspace.
      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Los tipos generados no tienen drift
        # openapi-typescript no tiene un modo --check propio: se regenera y se compara con
        # git diff. error-codes.ts sí lo tiene (scripts/gen-error-codes.mjs --check).
        run: |
          npm run gen:schema
          git diff --exit-code -- src/generated/schema.d.ts || {
            echo "::error::src/generated/schema.d.ts quedó desactualizado respecto a openapi/darwin.openapi.json. Regenerá con \`npm run gen:schema\`."
            exit 1
          }
          npm run gen:errors:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verificar el artefacto publicable
        # Espejo del `-m packaging` de Python: verifica lo que el consumidor recibe, no el
        # árbol de fuentes. Es donde aparecen los archivos que `files` en package.json se
        # olvida de incluir.
        run: |
          npm pack --dry-run --json > /tmp/pack.json
          node -e "
            const pack = JSON.parse(require('fs').readFileSync('/tmp/pack.json', 'utf-8'))[0];
            const archivos = pack.files.map((f) => f.path);
            console.log('Archivos en el tarball:', archivos);
            const necesarios = [
              'dist/index.js', 'dist/index.cjs', 'dist/index.d.ts',
              'dist/webauthn.js', 'dist/webauthn.cjs', 'dist/webauthn.d.ts',
              'dist/store.js', 'dist/store.cjs', 'dist/store.d.ts',
              'package.json',
            ];
            const faltan = necesarios.filter((n) => !archivos.includes(n));
            if (faltan.length > 0) {
              console.error('Faltan en el tarball:', faltan);
              process.exit(1);
            }
          "

  node-ok:
    name: "Gate de Node"
    # Agregador de nombre fijo: es el que hay que marcar como required en la protección de
    # rama, y no `test`. `test` ahora se saltea cuando el cambio no toca el cliente, y un
    # required check salteado a nivel *job* reporta `skipped` —que cuenta como éxito— sólo si
    # el agregador sigue corriendo. De ahí el `always()` y el `!= "skipped"` del veredicto.
    if: always()
    needs:
      - changes
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Veredicto
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          for result in $RESULTADOS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::El gate de Node falló."
              exit 1
            fi
          done
          echo "Gate de Node en verde."
