name: Bump version

# `commitizen-action@master` se reemplazó por steps explícitos. Tres motivos, cualquiera
# alcanzaría: es una acción de terceros sin pinnear con escritura sobre `master` en el camino
# que publica a PyPI; el pyproject ya no está en la raíz y hace falta un working-directory que
# la acción no expone; y con dos paquetes en el repo (Python + el cliente TS futuro) hacen
# falta dos configuraciones de commitizen que la acción no contempla.
#
# El checkout usa `PERSONAL_ACCESS_TOKEN` y no `GITHUB_TOKEN` a propósito: un push hecho con
# `GITHUB_TOKEN` no dispara otros workflows (protección de GitHub contra recursión), y
# `publish-to-pypi.yml` necesita que el push de este job dispare el workflow de publicación
# por el tag. Con `GITHUB_TOKEN` ese disparo nunca llega.
#
# Verificar antes de depender de este workflow para una release real: que
# `PERSONAL_ACCESS_TOKEN` sea un token con permiso de escritura sobre contenidos de este repo
# y que no esté por vencer.
on:
  push:
    branches:
      - master

permissions:
  # `contents: write` es para el `GITHUB_TOKEN` que usa el step "Release" al crear la
  # release por la API. El push del commit y el tag va por `PERSONAL_ACCESS_TOKEN`, no por
  # este permiso.
  contents: write

jobs:
  # ── Qué paquete tocó este push ──────────────────────────────────────────────
  # Los dos bumps son independientes, así que el filtro no puede ir en un `paths:` del `on:`:
  # ése filtra el workflow entero y no distingue un job del otro. Va acá, y cada bump se
  # condiciona con su salida.
  #
  # ⚠️ Esto acota **cuándo se dispara** el bump, no **cómo cuenta la versión**. `cz bump` sigue
  # mirando todos los commits desde el último tag del paquete, sin filtrar por ruta: si un push
  # que sólo toca `packages/hexcore/` lleva un `feat:`, el bump del cliente no corre en ese
  # push, pero ese mismo `feat:` sigue contando la próxima vez que el cliente sí bumpee. O sea
  # que difiere el bump espurio, no lo elimina — eliminarlo requeriría forkear la generación de
  # changelog de commitizen. Ver `CONTRIBUTING.md` §4.
  changes:
    name: "Qué paquete tocó este push"
    if: ${{ !startsWith(github.event.head_commit.message, 'bump:') }}
    runs-on: ubuntu-latest
    outputs:
      hexcore: ${{ steps.filtro.outputs.hexcore }}
      darwin_client: ${{ steps.filtro.outputs.darwin_client }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # El diff necesita la base del push, que con el checkout superficial por defecto no
          # está en el clon.
          fetch-depth: 0

      - name: Ver qué rutas tocó el push
        id: filtro
        env:
          BASE: ${{ github.event.before }}
          # `docs/hexcore/` cuenta como hexcore y `docs/darwin-client/` como el cliente: una
          # corrección de documentación con un `fix:` en el subject merece salir publicada en
          # el changelog del paquete que documenta.
          PATRON_HEXCORE: '^(packages/hexcore/|docs/hexcore/|uv\.lock$|pyproject\.toml$)'
          PATRON_CLIENTE: '^(packages/darwin-client/|docs/darwin-client/|package\.json$|package-lock\.json$)'
        run: |
          set -euo pipefail

          # Sin una base utilizable —el primer push de la rama, un force-push, o un historial
          # que no la contiene— no hay diff que calcular. Se bumpean los dos: equivocarse hacia
          # "publiqué una versión de más" es recuperable con un yank; hacia "no publiqué" deja
          # un fix escrito y sin llegar a nadie, y nadie se entera hasta que lo reportan otra
          # vez.
          if [ -z "${BASE:-}" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::notice::Sin una base comparable. Se evalúan los dos paquetes."
            echo "hexcore=true" >> "$GITHUB_OUTPUT"
            echo "darwin_client=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ARCHIVOS="$(git diff --name-only "$BASE" HEAD)"
          echo "Archivos tocados:"
          echo "$ARCHIVOS"

          if echo "$ARCHIVOS" | grep -qE "$PATRON_HEXCORE"; then
            echo "hexcore=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Este push no toca el paquete Python. No se bumpea hexcore."
            echo "hexcore=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$ARCHIVOS" | grep -qE "$PATRON_CLIENTE"; then
            echo "darwin_client=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Este push no toca el cliente TypeScript. No se bumpea darwin-client."
            echo "darwin_client=false" >> "$GITHUB_OUTPUT"
          fi

  bump-version:
    needs: changes
    if: ${{ needs.changes.outputs.hexcore == 'true' }}
    runs-on: ubuntu-latest
    name: "Bump version and create changelog with commitizen"
    defaults:
      run:
        working-directory: packages/hexcore
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `--extra all`: además de commitizen, este job corre `darwin_openapi.py` más abajo,
      # que monta los seis plugins de Darwin para regenerar el contrato con la versión nueva.
      - name: Install commitizen
        run: uv sync --extra all --group dev

      - name: Configurar identidad de git
        # `cz bump` commitea localmente. Sin esto, `git commit` falla en un runner limpio con
        # "Author identity unknown" antes de llegar a ningún otro paso.
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version y changelog
        id: cz
        # `cz bump` sale con 21 (`NoCommitsFoundError`) cuando no hay commits desde el último
        # tag que ameriten un bump — por ejemplo, un merge sólo de `chore:`/`test:`/`build:`.
        # Sin este manejo, ese caso normal dejaba "Bump version" en rojo en cada push a
        # `master` que no fuera un `feat`/`fix`, y un workflow rojo de forma rutinaria enseña
        # a ignorarlo.
        #
        # No pushea todavía: el siguiente step sincroniza `uv.lock` y lo agrega al mismo
        # commit antes de empujar nada.
        run: |
          set +e
          uv run cz bump --yes --changelog --no-verify
          exit_code=$?
          set -e
          # El 3 (NO_COMMITS_FOUND, ni un commit desde el tag) acompaña al 21 (NO_INCREMENT,
          # hay commits pero ninguno amerita bump): los dos son "nada que publicar". Acá el 3
          # es más raro que en el job del cliente —el tag de hexcore lo crea este mismo job, y
          # el push siguiente siempre trae al menos el commit del bump— pero aparece al
          # re-lanzar a mano un run cuyo bump ya se había completado.
          if [ "$exit_code" -eq 3 ] || [ "$exit_code" -eq 21 ]; then
            echo "::notice::Sin commits que ameriten un bump desde el último tag. Nada que publicar."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$exit_code" -ne 0 ]; then
            exit "$exit_code"
          fi
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "tag=hexcore-v$(uv run cz version --project)" >> "$GITHUB_OUTPUT"

      - name: Sincronizar uv.lock con la nueva versión
        # `version_provider = "pep621"` sólo toca `[project].version` en `pyproject.toml` —
        # `uv.lock`, que vive en la raíz del workspace y no junto al pyproject, se sincroniza
        # a mano. Se amenda al mismo commit del bump (todavía sin pushear, así que reescribir
        # el commit local no reescribe nada publicado) y se retaggea, para no dejar un commit
        # separado de "chore: sync lock" colgando de la release.
        if: steps.cz.outputs.bumped == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          uv lock --project packages/hexcore
          if ! git diff --quiet -- uv.lock; then
            git add uv.lock
            git commit --amend --no-edit
            git tag -f "${{ steps.cz.outputs.tag }}"
          fi

      - name: Regenerar el contrato de Darwin con la versión nueva
        # `openapi/VERSION` guarda la versión de hexcore que generó el contrato. Sin este
        # paso, cada bump lo deja desactualizado de inmediato y el job `contrato-http` de
        # typing.yml falla en el primer PR después de cualquier release — no porque el
        # contrato haya cambiado, sino porque nadie lo volvió a volcar. Mismo tratamiento que
        # uv.lock: se amenda al commit del bump, todavía sin pushear.
        if: steps.cz.outputs.bumped == 'true'
        run: |
          uv run python scripts/darwin_openapi.py --write
          cd "${{ github.workspace }}"
          if ! git diff --quiet -- packages/darwin-client/openapi; then
            git add packages/darwin-client/openapi
            git commit --amend --no-edit
            git tag -f "${{ steps.cz.outputs.tag }}"
          fi

      - name: Pushear el commit y el tag
        # Dos `git push` separados y **no** `git push --follow-tags`: empujar la rama y el
        # tag en una sola invocación no dispara el `on: push: tags:` de
        # publish-to-pypi.yml — probado a mano contra el repo real. GitHub sólo generó el
        # evento de push por tag cuando el tag se empujó en su propio comando; con
        # `--follow-tags` junto a la rama, el release quedaba taggeado pero jamás publicado,
        # sin ningún error visible. Encontrado porque hexcore-v9.1.0 y hexcore-v9.2.0 quedaron
        # en el repo sin que `publish-to-pypi.yml` corriera ni una vez.
        if: steps.cz.outputs.bumped == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git push origin HEAD:master
          git push origin "${{ steps.cz.outputs.tag }}"

      - name: Release
        if: steps.cz.outputs.bumped == 'true'
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          tag_name: ${{ steps.cz.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Segunda configuración de commitizen, independiente de la de arriba — ver el comentario
  # sobre "dos paquetes, dos configuraciones" al principio de este archivo. `needs:
  # bump-version` no es porque dependa de su resultado (por eso el `if` no exige `success`,
  # sólo que no haya fallado): es sólo para serializar los dos jobs, que si no correrían en
  # paralelo y pushearían a `master` desde el mismo commit base — el segundo en llegar
  # rebotaría por "non-fast-forward". Al encadenarlos, este job hace `checkout` de `master`
  # *después* de que el primero ya empujó el suyo.
  #
  # Bootstrap: `darwin-client-v0.1.0` se taggeó a mano (sin pasar por `cz bump`) el día que
  # se armó este workflow, con un `CHANGELOG.md` semilla escrito a mano — no generado. Sin
  # ese ancla, la primera corrida de `cz bump`/`cz changelog` no tiene ningún tag anterior
  # que reconozca (el `tag_format` es nuevo) y trata la *historia entera del repo* como si
  # fuera la v0.1.0, volcando cada commit de `hexcore` desde el principio de los tiempos en
  # el changelog de un paquete que ni los tocó. Verificado a mano en un worktree descartable
  # antes de confiar en esto para una release real — el mismo tipo de bug silencioso que ya
  # costó dos releases de PyPI sin publicar (ver el comentario de "Pushear el commit y el
  # tag" en el job de arriba).
  #
  # `always()` es lo que deja que este job corra cuando `bump-version` quedó **skipped** porque
  # el push no tocó nada de Python: sin él, un job cuyo `needs` se salteó se saltea también, y
  # un push que sólo toca el cliente nunca lo publicaría. `skipped` se acepta; `failure` y
  # `cancelled` no.
  bump-version-darwin-client:
    needs:
      - changes
      - bump-version
    if: |
      always() &&
      needs.changes.outputs.darwin_client == 'true' &&
      needs.bump-version.result != 'failure' &&
      needs.bump-version.result != 'cancelled'
    runs-on: ubuntu-latest
    name: "Bump version and changelog de darwin-client con commitizen"
    defaults:
      run:
        working-directory: packages/darwin-client
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          # Explícito y no el SHA que disparó el workflow: si `bump-version` (el job de
          # arriba) acaba de pushear un commit, ese commit tiene que estar en el checkout
          # de este job para no pushear después sobre una base vieja.
          ref: master
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Node
        # Para `npm install --package-lock-only` más abajo — `cz bump` en sí no lo necesita.
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar identidad de git
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version y changelog
        id: cz
        # `commitizen` no es una dependencia del paquete TS — se corre standalone vía
        # `uvx`, sin depender del venv de `packages/hexcore` (que además instala cosas que
        # este bump no necesita, como sqlalchemy/beanie).
        run: |
          set +e
          uvx --from commitizen cz bump --yes --changelog --no-verify
          exit_code=$?
          set -e
          # Los dos "no hay nada que publicar", y ninguno es un error: 3 (NO_COMMITS_FOUND) es
          # "ni un commit desde el tag" —el estado normal del cliente, cuyo ancla apunta al tip
          # de master, así que todo push que no toque el paquete cae acá— y 21 (NO_INCREMENT)
          # es "hay commits, pero ninguno amerita bump" (sólo chore:/test:/docs:).
          if [ "$exit_code" -eq 3 ] || [ "$exit_code" -eq 21 ]; then
            echo "::notice::darwin-client: sin commits que ameriten un bump desde el último tag."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$exit_code" -eq 16 ]; then
            # NO_REVISION: no hay ningún tag `darwin-client-v*` en el remoto desde el cual
            # arrancar el changelog incremental. Es el estado de bootstrap, y sin este mensaje
            # el job muere con un "No tag found to do an incremental changelog" pelado,
            # precedido de cincuenta líneas de "Invalid version tag: hexcore-vX" que hacen
            # parecer que el problema son los tags de hexcore. Peor: antes de morir, `cz`
            # informa un MAJOR falso (0.1.0 → 1.0.0), porque sin ancla recorre la historia
            # entera del repo y encuentra los BREAKING CHANGE viejos de hexcore.
            echo "::error::darwin-client: falta el tag ancla en el remoto. Creá uno que apunte al commit de master que corresponde a la versión de package.json y pusheálo: git tag -a darwin-client-v\$(node -p \"require('./packages/darwin-client/package.json').version\") -m 'ancla' && git push origin <tag>. Ver CONTRIBUTING.md §4."
            exit "$exit_code"
          elif [ "$exit_code" -ne 0 ]; then
            exit "$exit_code"
          fi
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "tag=darwin-client-v$(uvx --from commitizen cz version --project)" >> "$GITHUB_OUTPUT"

      - name: Sincronizar package-lock.json con la nueva versión
        # `version_provider = "npm"` sólo toca `packages/darwin-client/package.json` — el
        # `package-lock.json` de la raíz del workspace también guarda esa versión por
        # paquete y hay que resincronizarlo, mismo tratamiento que `uv.lock` en el job de
        # hexcore.
        if: steps.cz.outputs.bumped == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          npm install --package-lock-only
          if ! git diff --quiet -- package-lock.json; then
            git add package-lock.json
            git commit --amend --no-edit
            git tag -f "${{ steps.cz.outputs.tag }}"
          fi

      - name: Pushear el commit y el tag
        # Dos `git push` separados: el mismo motivo que en el job de hexcore, verificado
        # empíricamente contra este repo — `--follow-tags` junto con la rama no dispara el
        # `on: push: tags:` del workflow de publish.
        if: steps.cz.outputs.bumped == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          git push origin HEAD:master
          git push origin "${{ steps.cz.outputs.tag }}"

      - name: Release
        if: steps.cz.outputs.bumped == 'true'
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          tag_name: ${{ steps.cz.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
