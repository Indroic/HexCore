name: Publish Python 🐍 distribution to PyPI

# Publicar es irreversible: PyPI no permite reemplazar una versión ya subida, así que lo único
# que se puede hacer con una release mala es yankearla y sacar otra. Por eso todo lo que
# verifica va **antes** de `twine upload` y no después.
#
# Que eso haga falta no es hipotético. 7.0.0 se publicó sin que la suite corriera una sola vez
# sobre esa versión, y salió contradiciéndose: `REMOVED_IN = "7.0"` con el paquete ya en 7.0.0
# y los alias que prometía eliminar todavía adentro. El test que existe para impedirlo
# —`test_removed_in_is_ahead_of_the_published_version`— nunca se ejecutó.
#
# El agujero eran dos cosas a la vez, y hacían falta las dos para que pasara:
#
#   1. El commit del bump lo pushea `Bump version` con el `GITHUB_TOKEN`, y un push hecho con
#      ese token **no dispara workflows** — es la protección de GitHub contra recursión. O sea
#      que la suite corre sobre el merge y no sobre la versión que se publica, que es otro
#      árbol: el bump toca `pyproject.toml` y `CHANGELOG.md`.
#   2. `workflow_run` con `types: [completed]` dispara cuando el workflow **termina**, sin
#      mirar cómo. Un `Bump version` fallado publicaba igual.
#
# Los dos se cierran acá abajo: la condición de `conclusion == 'success'` y los jobs `tests` y
# `gate-tipado`, que corren sobre el árbol que se va a empaquetar.
on:
  workflow_run:
    workflows: ["Bump version"]
    types:
      - completed
  push:
    tags:
      - '*'

permissions:
  contents: read

jobs:
  # ── Verificación previa ─────────────────────────────────────────────────────
  tests:
    name: "Suite completa sobre lo que se va a publicar"
    # Si el bump falló, no hay nada que publicar. `types: [completed]` incluye `failure` y
    # `cancelled`, así que la condición es obligatoria y no una precaución.
    #
    # La segunda mitad deja pasar el disparo por tag, que no tiene `workflow_run` en el
    # contexto: sin ella, publicar a mano por tag quedaría bloqueado para siempre.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # Sin `ref:`, o sea la punta de la rama por defecto. Es deliberado: en un disparo por
        # `workflow_run`, `github.event.workflow_run.head_sha` apunta al commit que disparó
        # `Bump version` —el merge— y **no** al commit del bump, que se creó después. Checkoutear
        # ese sha empaquetaría la versión anterior.
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra all --group dev

      - name: Suite
        # Mismo gate de cero SKIPPED que `pytest.yml`, y el mismo `set -o pipefail`: sin él, el
        # `| tee` se queda con el exit code del tee y una suite en rojo pasaría en verde. En el
        # camino de una release eso es peor que en un PR.
        run: |
          set -o pipefail
          uv run pytest -q -rs | tee pytest-output.txt
          if grep -q '^SKIPPED' pytest-output.txt; then
            echo "::error::Hay tests saltados: falta alguna dependencia opcional en el entorno. No se publica."
            grep '^SKIPPED' pytest-output.txt
            exit 1
          fi

      - name: Empaquetado
        # Verifica sobre la wheel construida que `py.typed` y los `.pyi` lleguen, y que no se
        # publiquen `tests`, `scripts` ni `refs`. Es la comprobación que mira lo mismo que
        # recibe el consumidor.
        run: uv run pytest -m packaging -q

  gate-tipado:
    name: "Gate de tipado"
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    # Que el tipado le llegue al usuario es una propiedad **del artefacto**, no del repo: los
    # `.pyi` y el `py.typed` viajan adentro de la wheel. Por eso el gate se invoca acá y no se
    # confía en que haya corrido en algún PR — entre aquel PR y esta release hay al menos el
    # commit del bump, que nadie chequeó.
    #
    # `typing.yml` declara `workflow_call` justamente para esto.
    uses: ./.github/workflows/typing.yml

  # ── Construcción y publicación ──────────────────────────────────────────────
  build:
    needs: [tests, gate-tipado]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: |
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install twine
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          twine upload dist/*
