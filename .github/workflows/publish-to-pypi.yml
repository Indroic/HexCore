name: Publish Python 🐍 distribution to PyPI

# Publicar es irreversible: PyPI no permite reemplazar una versión ya subida, así que lo único
# que se puede hacer con una release mala es yankearla y sacar otra. Por eso todo lo que
# verifica va **antes** de publicar y no después.
#
# Se dispara por el tag prefijado (`hexcore-v*`) y no por `workflow_run` sobre "Bump version".
# Antes hacía falta el rodeo de `workflow_run` porque el push del bump se hacía con
# `GITHUB_TOKEN`, y un push hecho con ese token no dispara otros workflows (protección de
# GitHub contra recursión) — así que había que engancharse al workflow que sí corrió, y
# checkoutear la punta de la rama porque el sha del evento apuntaba al commit ANTERIOR al
# bump. Ahora que `bump_ver.yml` pushea con `PERSONAL_ACCESS_TOKEN`, el push del tag dispara
# este workflow directamente, y el checkout por defecto trae exactamente el tag que se va a
# publicar — no una aproximación.
#
# El filtro `hexcore-v*` y no `*` es a propósito: con dos paquetes en el repo, un tag
# `darwin-client-v0.1.0` no tiene que disparar una publicación a PyPI.
on:
  push:
    tags:
      - 'hexcore-v*'

permissions:
  contents: read

jobs:
  # ── Verificación previa ─────────────────────────────────────────────────────
  tests:
    name: "Suite completa sobre lo que se va a publicar"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/hexcore

    steps:
      - name: Checkout code
        # Sin `ref:`: en un disparo por tag, el checkout por defecto ya trae ese tag.
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra all --group dev

      - name: Suite
        # Mismo gate de cero SKIPPED que `pytest.yml`, y el mismo `set -o pipefail`: sin él, el
        # `| tee` se queda con el exit code del tee y una suite en rojo pasaría en verde. En el
        # camino de una release eso es peor que en un PR.
        run: |
          set -o pipefail
          uv run pytest -q -rs | tee pytest-output.txt
          if grep -q '^SKIPPED' pytest-output.txt; then
            echo "::error::Hay tests saltados: falta alguna dependencia opcional en el entorno. No se publica."
            grep '^SKIPPED' pytest-output.txt
            exit 1
          fi

      - name: Empaquetado
        # Verifica sobre la wheel construida que `py.typed` y los `.pyi` lleguen, y que no se
        # publiquen `tests`, `scripts` ni `refs`. Es la comprobación que mira lo mismo que
        # recibe el consumidor.
        run: uv run pytest -m packaging -q

  gate-tipado:
    name: "Gate de tipado"
    # Que el tipado le llegue al usuario es una propiedad **del artefacto**, no del repo: los
    # `.pyi` y el `py.typed` viajan adentro de la wheel. Por eso el gate se invoca acá y no se
    # confía en que haya corrido en algún PR — entre aquel PR y esta release puede haber pasado
    # cualquier cosa en `master`.
    uses: ./.github/workflows/typing.yml

  # ── Construcción y publicación ──────────────────────────────────────────────
  build:
    needs: [tests, gate-tipado]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/hexcore
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/hexcore/dist/

  publish:
    runs-on: ubuntu-latest
    needs: build
    # Trusted Publishing (OIDC) en vez de `secrets.PYPI_TOKEN`: un token de API en un secret es
    # una credencial de larga duración con permiso de publicación que cualquier workflow del
    # repo puede leer. El `environment: pypi` tiene que existir en Settings → Environments (ya
    # creado) y el trusted publisher tiene que configurarse del lado de PyPI apuntando a este
    # archivo de workflow exacto — ver el PR para el paso a paso pendiente.
    environment:
      name: pypi
      url: https://pypi.org/project/hexcore/
    permissions:
      id-token: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
