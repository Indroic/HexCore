name: Python tests

# El filtro por path va en un job `changes` y **no** en un `paths:` del `on:`. La diferencia no
# es de estilo: un workflow que el `paths:` filtra no arranca, así que no publica ningún check,
# y un required check que nunca reporta deja el PR bloqueado en "Expected — Waiting for status"
# para siempre. Un job que se salta por un `if:` sí reporta, y reporta `skipped`, que la
# protección de rama cuenta como éxito. Por eso el agregador `python-ok` corre siempre (`if:
# always()`) y acepta `skipped`: es él, y no `test`, el nombre que hay que marcar como
# obligatorio.
on:
  push:
    branches:
      - master
      - "release/**"
      - "feat/**"
  pull_request:
    # Filtra por rama **base**, así que sin `release/**` y `feat/**` los PRs de una
    # cadena apilada no disparan ningún check y el PR aparece sin CI.
    branches:
      - master
      - "release/**"
      - "feat/**"

permissions:
  contents: read

jobs:
  changes:
    name: "¿Cambió algo de hexcore?"
    runs-on: ubuntu-latest
    outputs:
      relevante: ${{ steps.filtro.outputs.relevante }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # El diff necesita la base del push/PR, que con el checkout superficial por defecto
          # no está en el clon.
          fetch-depth: 0

      - name: Ver qué rutas tocó el cambio
        id: filtro
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          # `docs/hexcore/` está en el patrón porque `test_documentation_examples.py` recorre
          # esas guías: una que nombre un símbolo inexistente tiene que romper el CI, y no lo
          # haría si un cambio sólo de documentación no disparara la suite.
          # `uv.lock` y el `pyproject.toml` de la raíz también: el primero fija las versiones
          # con las que corre todo, el segundo declara el workspace de uv.
          PATRON: '^(packages/hexcore/|docs/hexcore/|skills/|uv\.lock$|pyproject\.toml$|\.github/workflows/pytest\.yml$)'
        run: |
          set -euo pipefail

          # Sin una base utilizable —rama nueva (SHA de ceros), force-push, o un historial que
          # no la contiene— no hay diff que calcular. Se corre todo: equivocarse hacia "corrí
          # de más" cuesta minutos de runner; hacia "no corrí" cuesta un bug publicado.
          if [ -z "${BASE:-}" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::notice::Sin una base comparable. Se corre la suite completa."
            echo "relevante=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ARCHIVOS="$(git diff --name-only "$BASE" HEAD)"
          echo "Archivos tocados:"
          echo "$ARCHIVOS"

          if echo "$ARCHIVOS" | grep -qE "$PATRON"; then
            echo "relevante=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Este cambio no toca el paquete Python. La suite se saltea."
            echo "relevante=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.relevante == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        # El paquete Python vive en packages/hexcore/ desde la migración a monorepo.
        working-directory: packages/hexcore

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # `--extra all` es lo que hace que el suite se ejecute de verdad. Con sólo
        # `pip install -e .` faltan SQLAlchemy, FastAPI, Redis, aiosqlite y httpx, así que
        # los tests que dependen de ellos hacen `importorskip` y se saltan: CI reportaba
        # verde habiendo ejecutado menos de la mitad.
        # `--group dev` trae pytest, anyio y httpx desde el lockfile, para que el entorno
        # de CI y el de desarrollo no se puedan desincronizar.
        run: uv sync --extra all --group dev

      - name: Run tests
        # `-rs` lista los tests saltados. Con todos los extras instalados no debe haber
        # ninguno, así que un SKIPPED aquí significa que un extra no llegó al entorno y que
        # estaríamos reportando verde habiendo saltado tests. Se falla a propósito.
        run: |
          set -o pipefail
          uv run pytest -q -rs | tee pytest-output.txt
          if grep -q '^SKIPPED' pytest-output.txt; then
            echo "::error::Hay tests saltados: falta alguna dependencia opcional en el entorno de CI."
            grep '^SKIPPED' pytest-output.txt
            exit 1
          fi

      - name: Tests de empaquetado
        # Deseleccionados por `addopts` en la corrida de arriba, porque construyen la wheel.
        # Verifican lo que sólo se ve en el artefacto: que la wheel lleve `py.typed` y los
        # `.pyi`, y que no publique `tests`/`scripts`/`refs` como paquetes top-level.
        run: uv run pytest -m packaging -q

  python-ok:
    name: "Gate de Python"
    # Agregador de nombre fijo, espejo de `typing-ok` en typing.yml. Es el nombre que hay que
    # marcar como required en la protección de rama, y no `test`: `test` ahora se saltea cuando
    # el cambio no toca el paquete Python, y un required check salteado a nivel *job* reporta
    # `skipped` —que cuenta como éxito— sólo si el agregador sigue corriendo. De ahí el
    # `always()` y el `!= "skipped"` del veredicto.
    if: always()
    needs:
      - changes
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Veredicto
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          for result in $RESULTADOS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::El gate de Python falló."
              exit 1
            fi
          done
          echo "Gate de Python en verde."
