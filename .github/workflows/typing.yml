name: Typing & stubs

# Fase 0 del plan de tipado: se **mide**, no se rompe.
#
# Cada job se agregó **después** de que el código que gatea estuviera limpio. Al revés, el
# primer PR pone master en rojo, y un gate que arranca rojo se desactiva — que es exactamente
# cómo se llega a un repo con pyright en las dependencias de dev y en ningún workflow.
#
# Están: `house-rules`, `stubs-drift`, `typecheck`, `no-extras-import`, `extras-matrix` y
# `typing-ok`. `packaging` vive en `pytest.yml`, que ya arma la wheel y corre `-m packaging`.
#
# `stub-quality` **no** está, y el script que lo implementaría —`scripts/stub_quality.py`— sí.
# La razón está medida y no supuesta: `pyright --verifytypes` no resuelve el paquete por PEP 561
# ni en Windows ni en el runner de Ubuntu, con la wheel instalada en un venv limpio y con
# `--pythonpath` apuntándole. Devuelve cero módulos y cero símbolos. No es cosa de `hexcore`:
# probado contra `pydantic`, falla igual, así que es la herramienta en esta versión.
#
# El script queda porque detecta exactamente ese caso y lo dice; el día que `--verifytypes`
# ande, cablearlo es agregar el job. Lo que no se deja es un check permanentemente rojo detrás
# de `continue-on-error`: enseña a ignorar el workflow, que es peor que no tener el job.
#
# `workflow_call` está declarado a propósito: cuando el gate se enganche a
# `publish-to-pypi.yml`, ese workflow lo invoca en vez de duplicar los pasos.

on:
  push:
    branches:
      - master
      - "release/**"
      - "feat/**"
  pull_request:
    # Filtra por rama **base**, igual que `pytest.yml`: sin `release/**` y `feat/**` los
    # PRs de una cadena apilada no disparan ningún check.
    branches:
      - master
      - "release/**"
      - "feat/**"
  workflow_call:

permissions:
  contents: read

jobs:
  # ── La regla de tipado de la casa ───────────────────────────────────────────
  house-rules:
    name: "Regla de tipado de la casa"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # El script sólo lee ASTs: no importa hexcore ni necesita un extra. Es el job más
      # barato del workflow, y por eso va primero — si el idioma está mal, se sabe en
      # segundos y no después de instalar todo.
      - name: Install dependencies
        run: uv sync --group dev

      - name: Verificar
        run: uv run python scripts/house_rules.py

  # ── Stubs sincronizados con su _EXPORTS ─────────────────────────────────────
  stubs-drift:
    name: "Stubs sincronizados con _EXPORTS"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `gen_stubs.py` trabaja sobre el AST de las tres fachadas: no importa hexcore ni
      # necesita un solo extra. Es el job más rápido del workflow, así que va primero.
      - name: Install dependencies
        run: uv sync --group dev

      - name: Regenerar y comparar
        run: uv run python scripts/gen_stubs.py --check

  typecheck:
    name: "Pyright strict sobre hexcore/"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # `--extra all` a propósito: los tipos de los adaptadores opcionales son REALES
        # (`app: procrastinate.App`, `redis_client: Redis`), así que chequearlos exige tener
        # el paquete instalado. La garantía de "importa sin extras" es de runtime y la mide
        # `tests/test_optional_dependencies.py`, no este job.
        run: uv sync --extra all --group dev

      - name: Pyright
        # Sin `set -o pipefail` y con `|| true`: pyright sale con 1 si hay un solo error, y
        # acá el veredicto lo da el ratchet, no el exit code de pyright.
        run: |
          uv run pyright --outputjson hexcore > pyright.json || true
          uv run python - <<'PY'
          import json
          resumen = json.load(open("pyright.json", encoding="utf-8"))["summary"]
          print("::group::Resumen de Pyright")
          print(resumen)
          print("::endgroup::")
          PY

      - name: Anotaciones en el PR
        # Un `::error file=…,line=…::` por diagnóstico, así el error aparece **en la línea**
        # del diff y no hay que abrir el log. No falla el job: el veredicto es del ratchet.
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          raiz = Path.cwd()
          reporte = json.load(open("pyright.json", encoding="utf-8"))
          for d in reporte.get("generalDiagnostics", []):
              if d.get("severity") != "error":
                  continue
              try:
                  ruta = Path(d["file"]).resolve().relative_to(raiz).as_posix()
              except ValueError:
                  ruta = d["file"]
              linea = d["range"]["start"]["line"] + 1
              regla = d.get("rule", "sin-regla")
              mensaje = d["message"].splitlines()[0]
              print(f"::error file={ruta},line={linea}::[{regla}] {mensaje}")
          PY

      - name: Ratchet de errores
        run: uv run python scripts/typing_ratchet.py errors --report pyright.json

      - name: Tests de tipo (tests/typing/)
        # Deseleccionados por `addopts`, así que acá se piden explícitamente. Corren Pyright
        # sobre `tests/typing/`, donde los `assert_type` fijan que las fachadas NO tipen
        # `Any` — el estado anterior a los `.pyi` generados.
        run: uv run pytest -m typing -q

      - name: Subir el JSON de Pyright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyright-report
          path: pyright.json
          retention-days: 14

  # ── El núcleo importa sin un solo extra ─────────────────────────────────────
  no-extras-import:
    name: "Imports sin ningún extra"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        # `--group dev` **sin** un solo `--extra`, que es el punto del job: el resto del
        # workflow instala `--extra all`, y con todo puesto un import sin guarda anda igual.
        # Acá no hay nada que lo tape.
        run: uv sync --group dev

      - name: Las fachadas importan peladas
        # Antes que los tests, y a propósito: si esto se rompe, el error sale de un `import`
        # y no de un subproceso con un finder falso, que es mucho más fácil de leer.
        run: uv run python scripts/extra_smoke.py none

      # `tests/test_optional_dependencies.py` **no** se corre acá, y la primera versión de
      # este job lo hacía mal: con cero extras fallaban 21 casos. No era un defecto del código
      # sino del job. Ese archivo afirma "el módulo X importa con el extra Y **bloqueado**", y
      # eso sólo tiene sentido si los extras que X sí necesita están puestos: pedirle a
      # `darwin.plugins.oauth.orms.sqlalchemy.repository` que importe sin `beanie` es correcto,
      # pedirle que importe sin SQLAlchemy no.
      #
      # Corre en `pytest.yml`, que instala `--extra all` y deja que el finder de
      # `sys.meta_path` haga el bloqueo — que es como el archivo está diseñado.

  # ── Cada extra, solo, alcanza para lo que promete ───────────────────────────
  extras-matrix:
    name: "Extra ${{ matrix.extra }}"
    runs-on: ubuntu-latest

    # El punto ciego que esto cierra: hasta acá CI instalaba `--extra all` y nada más. Con
    # todo puesto, un extra al que le falta una dependencia declarada anda igual, porque se la
    # presta otro. El consumidor que instala uno solo es el que se come el ImportError.
    #
    # Son 18 patas: `none`, los 16 extras y `all`. Nueve son de Darwin, y las seis de plugin
    # verifican la promesa que el `pyproject` hace explícita — que
    # `pip install 'hexcore[darwin-two-factor]'` trae el núcleo por la autorreferencia a
    # `hexcore[darwin]`. Sin la autorreferencia ese comando instalaba un plugin sin núcleo.
    strategy:
      fail-fast: false
      matrix:
        extra:
          - none
          - api
          - sql
          - mongo
          - redis
          - rabbitmq
          - procrastinate
          - celery
          - darwin
          - darwin-sqlalchemy
          - darwin-beanie
          - darwin-magic-link
          - darwin-two-factor
          - darwin-oauth
          - darwin-impersonate
          - darwin-passkey
          - darwin-organization
          - all

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar sólo este extra
        # Se instala **la wheel construida**, no el checkout editable, y no es un detalle: un
        # editable resuelve el paquete desde el árbol de fuentes, así que un archivo que el
        # empaquetado se olvide de publicar se importa igual. Instalar la wheel es lo que hace
        # que la pata mida lo que el consumidor recibe.
        run: |
          uv build --wheel -o dist
          WHEEL=$(ls dist/*.whl)
          uv venv .venv-extra
          if [ "${{ matrix.extra }}" = "none" ]; then
            uv pip install --python .venv-extra "$WHEEL"
          else
            uv pip install --python .venv-extra "$WHEEL[${{ matrix.extra }}]"
          fi

      - name: Verificar la promesa del extra
        run: .venv-extra/bin/python scripts/extra_smoke.py ${{ matrix.extra }}

  typing-ok:
    name: "Gate de tipado"
    # Agregador de nombre fijo. Es el ÚNICO check que hay que marcar como obligatorio en la
    # protección de rama: los nombres de `extras-matrix` son dinámicos (`Extra darwin-oauth`)
    # y no se pueden marcar como required uno por uno, así que todos llegan acá por `needs`.
    #
    # `stub-quality` **no** está en `needs`: hoy es `continue-on-error` y su resultado no debe
    # decidir nada. Entra acá el día que deje de medir y pase a gatear.
    if: always()
    needs:
      - house-rules
      - stubs-drift
      - typecheck
      - no-extras-import
      - extras-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Veredicto
        # La expresión va por `env:` y no interpolada adentro del `run:`. GitHub rechazaba el
        # workflow **entero** con `RESULTS='${{ join(needs.*.result, " ") }}'`: las comillas
        # dobles adentro de la expresión, dentro de un string del shell, dentro de un bloque
        # literal de YAML, le rompían el parser. El síntoma era el peor posible — un run que
        # falla en 0 s, sin un solo job, sin log y sin anotación, o sea sin nada que leer.
        #
        # Pasarla por `env:` la saca del texto del comando, que ademas es la forma recomendada:
        # una expresión interpolada directo en un `run:` es una inyección esperando un valor
        # con comillas.
        env:
          RESULTADOS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTADOS"
          for result in $RESULTADOS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::El gate de tipado falló. Mirá qué job está en rojo: cada uno imprime su propia remediación."
              exit 1
            fi
          done
          echo "Gate de tipado en verde."
